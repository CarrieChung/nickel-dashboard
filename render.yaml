services:
  - type: web
    name: nickel-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn nickel.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 300 --graceful-timeout 30 --max-requests 500 --max-requests-jitter 50"
    autoDeploy: true